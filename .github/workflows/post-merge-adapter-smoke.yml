name: Post-merge adapter smoke

on:
  push:
    branches: [main]
    paths:
      - "src/gradwindow/programme_adapters/**"
      - "src/gradwindow/programme_discovery.py"
      - "src/gradwindow/browser_rendering.py"
      - "scripts/changed_adapter_keys.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      adapters: ${{ steps.changed.outputs.adapters }}
      count: ${{ steps.changed.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e "."
      - name: Find changed registered adapters
        id: changed
        run: >-
          python scripts/changed_adapter_keys.py
          --base "${{ github.event.before }}"
          --head "${{ github.sha }}"
          --github-output "$GITHUB_OUTPUT"

  smoke:
    needs: changes
    if: needs.changes.outputs.count != '0'
    runs-on: ubuntu-latest
    concurrency:
      group: application-data-state-writes
      cancel-in-progress: false
      queue: max
    env:
      CLOUDFLARE_BROWSER_CACHE_DIR: .cache/browser-fetch
      BROWSER_CACHE_SCOPE: ${{ matrix.adapter }}
      CLOUDFLARE_BROWSER_MIN_INTERVAL_SECONDS: "12"
    strategy:
      fail-fast: false
      matrix:
        adapter: ${{ fromJSON(needs.changes.outputs.adapters) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e "."
      - uses: ./.github/actions/browser-checkpoint
        with:
          mode: restore
      - name: Live dry-run changed adapter
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BROWSER_API_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: gradwindow discover-programmes --university "${{ matrix.adapter }}" --dry-run
      - uses: ./.github/actions/browser-checkpoint
        if: always()
        with:
          mode: save
