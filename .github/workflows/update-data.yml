name: Update application windows

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      translation_only:
        description: "Only update missing programme translations"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "data/applications.json"
      - "data/predictions.json"
      - "data/programs.json"
      - "data/programme-groups.json"
      - "data/programme-translations.json"
      - "data/universities.json"
      - "data/ops/programme-candidates.json"
      - "data/ops/programme-candidates/**"
      - "data/ops/window-candidates.json"
      - "data/ops/window-candidates/**"
      - "data/ops/programme-catalog-state.json"
      - "data/ops/programme-catalog-state/**"
      - "scripts/update_programme_translations.py"
      - "src/gradwindow/**"
      - ".github/workflows/update-data.yml"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-application-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Validate pushed data
        if: github.event_name == 'push'
        run: |
          gradwindow predictions
          gradwindow validate
          gradwindow coverage

      - name: Run daily pipeline
        if: github.event_name != 'push' && !inputs.translation_only
        env:
          SERPER_SEARCH_API_KEY: ${{ secrets.SERPER_SEARCH_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_BROWSER_API_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_API_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: gradwindow pipeline --skip-build

      - name: Update programme translations
        if: github.event_name != 'push'
        id: programme_translations
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY is not configured; skipping programme translations."
            exit 0
          fi
          python scripts/update_programme_translations.py

      - name: Report programme translation failure
        if: >-
          github.event_name != 'push' &&
          steps.programme_translations.outcome == 'failure'
        run: |
          echo "::warning title=Programme translation update failed::The data pipeline succeeded, but DeepSeek translation failed. Successfully checkpointed batches will still be included in the automated publication pull request."
          {
            echo "### Programme translation warning"
            echo ""
            echo "The application-data pipeline succeeded, but the optional DeepSeek translation step failed."
            echo "Successfully checkpointed translation batches are preserved and the automated publication pull request will still be created."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit translation-only refresh
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.translation_only &&
          steps.programme_translations.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/programme-translations.json
          if git diff --cached --quiet; then
            echo "No translation changes to commit."
            exit 0
          fi
          git commit -m "data: translate published programmes"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Test refreshed data before publication
        if: github.event_name != 'push' && !inputs.translation_only
        run: pytest -q

      - name: Open or update automated data publication pull request
        if: github.event_name != 'push' && !inputs.translation_only
        id: data-pr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "data: refresh application windows"
          branch: automation/application-data
          delete-branch: true
          title: "data: publish automated application-window refresh"
          body: |
            Automated daily refresh of monitoring state, parser candidates,
            programme-discovery candidates, predictions, evidence snapshots,
            coverage, and review reports.

            Dedicated adapters automatically promote only complete application
            windows with official exact opening and closing dates. Inferred or
            incomplete windows and parser date changes remain unpublished.
          add-paths: |
            data/applications.json
            data/predictions.json
            data/programs.json
            data/programme-translations.json
            data/evidence/
            data/coverage.json
            data/ops/
            README.md
            README.zh-CN.md

      - name: Merge validated data publication
        if: >-
          github.event_name != 'push' &&
          !inputs.translation_only &&
          steps.data-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr merge "${{ steps.data-pr.outputs.pull-request-number }}"
          --repo "$GITHUB_REPOSITORY"
          --squash
          --delete-branch

      - name: Start production test and deployment
        if: >-
          github.event_name != 'push' &&
          !inputs.translation_only &&
          steps.data-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run tests.yml
          --repo "$GITHUB_REPOSITORY"
          --ref main
