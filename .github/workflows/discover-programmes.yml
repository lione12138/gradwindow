name: Discover programmes for one university

on:
  workflow_dispatch:
    inputs:
      university:
        description: Adapter key from programme_adapters/registry.py
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: application-data-state-writes
  cancel-in-progress: false
  queue: max

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_BROWSER_CACHE_DIR: .cache/browser-fetch
      CLOUDFLARE_BROWSER_MIN_INTERVAL_SECONDS: "12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - uses: ./.github/actions/browser-checkpoint
        with:
          mode: restore
      - name: Run selected programme adapter
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BROWSER_API_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python - <<'PY'
          import sqlite3
          from bs4 import BeautifulSoup
          db = sqlite3.connect('.cache/browser-fetch/pages.sqlite3')
          for body, in db.execute('SELECT body FROM pages'):
              soup = BeautifulSoup(body, 'html.parser')
              counters = soup.select('.course-feed-listing-view__result-count')
              if not counters:
                  continue
              print({'counts': [c.get_text(' ', strip=True) for c in counters],
                     'cards': len(soup.select('article.course-feed-listing-item')),
                     'first': [h.get_text(' ', strip=True) for h in soup.select('.course-feed-listing-item__heading--main')[:1]],
                     'next': [a.get('href') for a in soup.select('nav.pager a[rel="next"]')]})
          print('metrics', db.execute('SELECT name,value FROM metrics').fetchall())
          raise SystemExit('Read-only diagnosis complete; do not create candidate data')
          PY
      - uses: ./.github/actions/browser-checkpoint
        if: always()
        with:
          mode: save
      - name: Validate discovery outputs
        run: |
          gradwindow validate
          pytest -q
      - name: Open or update programme discovery pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "data: refresh ${{ inputs.university }} programme discovery"
          branch: automation/programme-discovery-${{ inputs.university }}
          delete-branch: true
          title: "data: review ${{ inputs.university }} programme discovery"
          body: |
            Runs the selected official programme adapter and updates its
            programme candidates, exact-window candidates, and catalogue state.

            Discovery outputs remain operational review data. No application
            window is promoted into the published table by this workflow.
          add-paths: |
            data/ops/programme-candidates.json
            data/ops/programme-candidates/
            data/ops/window-candidates.json
            data/ops/window-candidates/
            data/ops/programme-catalog-state.json
            data/ops/programme-catalog-state/
