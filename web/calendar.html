<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Plan master's applications with a monthly calendar of verified opening dates and deadlines for top-200 universities across major global rankings, with direct official sources."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://gradwindow.com/calendar.html" />
    <meta property="og:title" content="Master's Application Deadline Calendar | GradWindow" />
    <meta property="og:description" content="Plan master's applications with a monthly calendar of verified opening dates and deadlines for top-200 universities across major global rankings, with direct official sources." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GradWindow" />
    <meta property="og:url" content="https://gradwindow.com/calendar.html" />
    <meta property="og:image" content="https://gradwindow.com/og-image-multiranking.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Master's Application Deadline Calendar | GradWindow" />
    <meta name="twitter:description" content="Plan master's applications with a monthly calendar of verified opening dates and deadlines for top-200 universities across major global rankings, with direct official sources." />
    <meta name="twitter:image" content="https://gradwindow.com/og-image-multiranking.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Master's Application Deadline Calendar",
        "url": "https://gradwindow.com/calendar.html",
        "isPartOf": { "@type": "WebSite", "name": "GradWindow", "url": "https://gradwindow.com/" }
      }
    </script>
    <link rel="modulepreload" href="./calendar.js" />
    <link rel="modulepreload" href="./i18n.js" />
    <link rel="modulepreload" href="./status.js" />
    <link rel="modulepreload" href="./intake-filter.js" />
    <link rel="modulepreload" href="./localization.js" />
    <title>Master's Application Deadline Calendar | GradWindow</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./experience.css" />
  </head>
  <body class="experience-page calendar-experience">
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="GradWindow home">
          <span class="brand-mark">G</span>
          <span>GradWindow</span>
        </a>
        <nav class="header-nav" aria-label="Main navigation">
          <a class="calendar-back-link" href="./#application-board" data-i18n="navTrackerShort">Tracker</a>
          <a class="calendar-nav" href="./calendar.html" data-i18n="navCalendar">Calendar</a>
          <a href="./?saved=1&amp;status=all&amp;dates=all#application-board" data-i18n="navSaved">Saved</a>
        </nav>
          <div class="header-controls">
            <button class="header-control" id="language-toggle" type="button" aria-label="Switch language">中文</button>
            <button class="header-control icon-only-control" id="theme-toggle" type="button" aria-label="Switch color theme">◐</button>
          </div>
      </header>

      <main>
        <section class="calendar-page">
          <div class="calendar-page-heading">
            <div>
              <span class="section-kicker" data-i18n="calendarKicker">APPLICATION CALENDAR</span>
              <h1 data-i18n="calendarPageTitle">Application calendar</h1>
              <p data-i18n="calendarPageDescription">
                Browse opening dates and deadlines as a real monthly calendar.
              </p>
            </div>
            <a class="toolbar-button calendar-back-link" href="./#application-board" data-i18n="calendarBack">Back to tracker</a>
          </div>

          <div class="calendar-page-toolbar">
            <label class="search-box">
              <span aria-hidden="true">⌕</span>
              <input
                id="calendar-search"
                aria-label="Search application windows"
                data-i18n-aria-label="heroSearchLabel"
                type="search"
                placeholder="Search university, programme, or country"
                data-i18n-placeholder="searchPlaceholder"
              />
            </label>
            <label class="select-wrap">
              <span data-i18n="rankingFilter">Ranking</span>
              <select id="calendar-ranking">
                <option value="qs">QS</option><option value="the">THE</option><option value="arwu">ARWU</option>
              </select>
            </label>
            <label class="select-wrap">
              <span data-i18n="rankRangeFilter">Rank range</span>
              <select id="calendar-qs">
                <option value="30">QS Top 30</option>
                <option value="50">QS Top 50</option>
                <option value="100">QS Top 100</option>
                <option value="150">QS Top 150</option>
                <option value="200" selected>QS Top 200</option>
              </select>
            </label>
            <label class="select-wrap">
              <span class="sr-only" data-i18n="calendarStatusFilter">Status</span>
              <select id="calendar-status">
                <option value="all" data-i18n="calendarAllStatuses">All statuses</option>
                <option value="open" data-i18n="statusOpen">Open now</option>
                <option value="upcoming" data-i18n="statusUpcoming">Opening soon</option>
                <option value="future" data-i18n="statusFuture">Future</option>
                <option value="closed" data-i18n="statusClosed">Closed</option>
              </select>
            </label>
          </div>
          <p class="calendar-filter-context" id="calendar-filter-context"></p>
          <a class="calendar-back-link" href="./#application-board" data-i18n="calendarEditFilters">Edit filters in tracker</a>

          <section class="calendar-panel calendar-page-panel" aria-live="polite">
            <div class="calendar-panel-header">
              <div>
                <span class="section-kicker" data-i18n="calendarAllEvents">All events</span>
                <h2 id="calendar-month-label">--</h2>
                <div class="calendar-legend">
                  <span><i class="legend-dot open"></i><span data-i18n="calendarOpenLegend">Opening date</span></span>
                  <span><i class="legend-dot deadline"></i><span data-i18n="calendarDeadlineLegend">Deadline</span></span>
                </div>
              </div>
              <div class="calendar-controls">
                <label class="select-wrap"><span class="sr-only" data-i18n="calendarMonthPicker">Choose month</span><input type="month" id="calendar-month-picker" class="calendar-month-picker" /></label>
                <button class="icon-button" id="calendar-prev" type="button" aria-label="Previous month">‹</button>
                <button class="toolbar-button" id="calendar-today" type="button" data-i18n="calendarToday">Today</button>
                <button class="icon-button" id="calendar-next" type="button" aria-label="Next month">›</button>
              </div>
            </div>
            <div class="calendar-view-controls">
              <button type="button" class="toolbar-button" id="calendar-agenda-view" data-i18n="calendarAgenda">Agenda</button>
              <button type="button" class="toolbar-button" id="calendar-month-view" data-i18n="calendarMonthView">Month</button>
              <button type="button" class="toolbar-button" id="calendar-clear-day" hidden data-i18n="calendarShowMonth">Show whole month</button>
            </div>
            <div id="calendar-month-grid">
            <div class="calendar-weekdays" id="calendar-weekdays"></div>
            <div class="calendar-grid" id="calendar-grid"></div>
            </div>
          </section>

          <section class="calendar-month-list">
            <div class="group-heading">
              <h3 id="calendar-list-title" tabindex="-1" data-i18n="calendarMonthEvents">Events this month</h3>
              <p id="calendar-result-count">0</p>
            </div>
            <div id="calendar-list" class="calendar-list"></div>
            <button id="calendar-load-more" class="toolbar-button" type="button" hidden data-i18n="calendarLoadMore">Show next 50 events</button>
          </section>
        </section>
      </main>
      <footer>
        <a href="./sources.html" data-i18n="dataSource">Data source</a> ·
        <a href="./privacy.html" data-i18n="privacyPolicy">Privacy policy</a> ·
        <a href="https://github.com/lione12138/gradwindow" data-i18n="navGithub">GitHub</a>
      </footer>
    </div>
    <script type="module" src="./calendar.js"></script>
  </body>
</html>
